# ==============================================================================
# FLARE Render Blueprint Specification (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. FLARE Backend: FastAPI Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: flare-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: FRONTEND_ORIGIN
        value: https://flare-frontend.onrender.com
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: flare-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "5"
      - key: DB_CONNECT_TIMEOUT
        value: "5"

  # ---------------------------------------------------------------------------
  # 2. FLARE Frontend: React 19 + Vite Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: flare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://flare-backend.onrender.com/api/v1

# ---------------------------------------------------------------------------
# 3. FLARE PostgreSQL Database
# ---------------------------------------------------------------------------
databases:
  - name: flare-db
    databaseName: flare_prod
    user: flare_user
    plan: free
    region: oregon
